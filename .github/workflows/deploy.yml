name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://devquiz-api-5ecj.onrender.com
        run: npm run build

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via rsync over SSH (with retries)
        run: |
          SSH_OPTS="-4 -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=60 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt of 3..."
            rsync -avzr --delete \
              -e "ssh $SSH_OPTS" \
              frontend/dist/ \
              u991251419@srv1563.hstgr.io:/home/u991251419/domains/josepaulotimbang.com/public_html/devquiz/ \
              && echo "Deploy successful." && exit 0
            echo "Attempt $attempt failed."
            [ $attempt -lt 3 ] && echo "Waiting 15s before retry..." && sleep 15
          done
          echo "All 3 deploy attempts failed."
          exit 1
